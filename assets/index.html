<script>
const PROJECTS=[{"name": "LumiSign", "year": "2026", "langs": ["TypeScript", "Python", "CSS", "JavaScript", "HTML"], "techs": []}, {"name": "ravijaanthony_", "year": "2026", "langs": ["other"], "techs": []}, {"name": "STSBookingSystem", "year": "2026", "langs": ["Python", "TypeScript", "CSS", "Shell", "Dockerfile", "HTML"], "techs": []}, {"name": "Java_Concurrency", "year": "2026", "langs": ["Java"], "techs": []}, {"name": "KaprukaAgentChallenge2026", "year": "2026", "langs": ["TypeScript", "CSS", "Dockerfile", "JavaScript"], "techs": []}, {"name": "asciiartclock", "year": "2026", "langs": ["QML"], "techs": []}, {"name": "MedWikiAgentic", "year": "2026", "langs": ["TypeScript", "Python", "CSS", "Dockerfile", "JavaScript", "HTML"], "techs": []}, {"name": "cv_pipeline", "year": "2026", "langs": ["JavaScript", "TypeScript", "CSS", "HTML", "Dockerfile"], "techs": []}, {"name": "Maze-Traversal", "year": "2026", "langs": ["Java"], "techs": []}];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const listContainer=document.getElementById('projects-list');
PROJECTS.forEach(p=>{
 const item=document.createElement('div');item.className='project-item';
 let html=`<div class="project-title">${esc(p.name)}<span class="project-year">(${p.year})</span></div>`;
 if(p.langs&&p.langs.length) html+=`<div class="project-meta">- ${p.langs.join(' · ')}</div>`;
 if(p.techs&&p.techs.length) html+=`<div class="project-meta project-techs">- ${p.techs.join(' · ')}</div>`;
 item.innerHTML=html;listContainer.appendChild(item)});

const tip=document.getElementById('tip');
document.querySelector('.disk-wrap').addEventListener('mousemove',e=>{
 const t=e.target.closest('path[data-path]');
 if(!t){tip.style.display='none';return}
 tip.innerHTML=t.dataset.path+'<br>'+t.dataset.size+'<br>'+t.dataset.pct+'% of total';
 tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+10+'px'});
document.querySelector('.disk-wrap').addEventListener('mouseleave',()=>tip.style.display='none');
</script></body></html>
