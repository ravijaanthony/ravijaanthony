<!doctype html><html><head><meta charset="utf-8"><title>ravijaanthony</title>
<style>body{background:#191919;margin:0;display:grid;place-items:center;min-height:100vh}
#wrap{position:relative}svg{width:min(92vmin,760px);height:auto}
path{cursor:pointer}path:hover{filter:brightness(.65)}
#hint{position:absolute;bottom:6px;width:100%;text-align:center;font:12px monospace;color:#777}
#tip{position:fixed;display:none;background:#2b2b2b;color:#ddd;border:1px solid #555;padding:8px 12px;font:13px/1.6 monospace;border-radius:4px;pointer-events:none;white-space:nowrap}</style></head><body>
<div id="wrap"><div id="chart"></div><div id="hint">click a language to fan out its projects · click the core to reset</div></div>
<div id="tip"></div>
<script>
const DATA={"name": "ravijaanthony", "value": 32, "children": [{"name": "TypeScript", "_kind": "lang", "value": 5, "children": [{"name": "KaprukaAgentChallenge2026", "_kind": "repo", "value": 1}, {"name": "cv_pipeline", "_kind": "repo", "value": 1}, {"name": "LumiSign", "_kind": "repo", "value": 1}, {"name": "MedWikiAgentic", "_kind": "repo", "value": 1}, {"name": "STSBookingSystem", "_kind": "repo", "value": 1}]}, {"name": "CSS", "_kind": "lang", "value": 5, "children": [{"name": "KaprukaAgentChallenge2026", "_kind": "repo", "value": 1}, {"name": "cv_pipeline", "_kind": "repo", "value": 1}, {"name": "LumiSign", "_kind": "repo", "value": 1}, {"name": "MedWikiAgentic", "_kind": "repo", "value": 1}, {"name": "STSBookingSystem", "_kind": "repo", "value": 1}]}, {"name": "HTML", "_kind": "lang", "value": 5, "children": [{"name": "cv_pipeline", "_kind": "repo", "value": 1}, {"name": "LumiSign", "_kind": "repo", "value": 1}, {"name": "MedWikiAgentic", "_kind": "repo", "value": 1}, {"name": "STSBookingSystem", "_kind": "repo", "value": 1}, {"name": "ravijaanthony_test", "_kind": "repo", "value": 1}]}, {"name": "Dockerfile", "_kind": "lang", "value": 4, "children": [{"name": "KaprukaAgentChallenge2026", "_kind": "repo", "value": 1}, {"name": "cv_pipeline", "_kind": "repo", "value": 1}, {"name": "MedWikiAgentic", "_kind": "repo", "value": 1}, {"name": "STSBookingSystem", "_kind": "repo", "value": 1}]}, {"name": "JavaScript", "_kind": "lang", "value": 4, "children": [{"name": "KaprukaAgentChallenge2026", "_kind": "repo", "value": 1}, {"name": "cv_pipeline", "_kind": "repo", "value": 1}, {"name": "LumiSign", "_kind": "repo", "value": 1}, {"name": "MedWikiAgentic", "_kind": "repo", "value": 1}]}, {"name": "Python", "_kind": "lang", "value": 4, "children": [{"name": "LumiSign", "_kind": "repo", "value": 1}, {"name": "MedWikiAgentic", "_kind": "repo", "value": 1}, {"name": "STSBookingSystem", "_kind": "repo", "value": 1}, {"name": "ravijaanthony_test", "_kind": "repo", "value": 1}]}, {"name": "Java", "_kind": "lang", "value": 2, "children": [{"name": "Maze-Traversal", "_kind": "repo", "value": 1}, {"name": "Java_Concurrency", "_kind": "repo", "value": 1}]}, {"name": "QML", "_kind": "lang", "value": 1, "children": [{"name": "asciiartclock", "_kind": "repo", "value": 1}]}, {"name": "Shell", "_kind": "lang", "value": 1, "children": [{"name": "STSBookingSystem", "_kind": "repo", "value": 1}]}, {"name": "other", "_kind": "lang", "value": 1, "children": [{"name": "ravijaanthony", "_kind": "repo", "value": 1}]}], "_projects": 10};
const S=720,C=360,HOLE=78,TAU=2*Math.PI;
let sel=null,idmap=[];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function hsv(h,s,v){const f=h*6,i=Math.floor(f),t=f-i,p=v*(1-s),q=v*(1-s*t),w=v*(1-s*(1-t));
const m=[[v,w,p],[q,v,p],[p,v,w],[p,q,v],[w,p,v],[v,p,q]][i%6];
return"#"+m.map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const col=(i,n,d,j)=>hsv((i/n)%1,.62,Math.max(.4,.97-.10*d-.05*(j%4)));
function P(r,a){return[C+r*Math.cos(a),C+r*Math.sin(a)]}
function sec(r0,r1,a0,a1){a1=Math.min(a1,a0+TAU-1e-4);const L=a1-a0>Math.PI?1:0,f=x=>x.toFixed(2);
const[x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);
return`M${f(x0)},${f(y0)} A${r1},${r1} 0 ${L} 1 ${f(x1)},${f(y1)} L${f(x2)},${f(y2)} A${r0},${r0} 0 ${L} 0 ${f(x3)},${f(y3)} Z`}
function render(){
 idmap=[];
 const B=S/2-HOLE-6, inner=sel?B*0.62:B, n=DATA.children.length||1;
 const out=[`<svg viewBox="0 0 ${S} ${S}" font-family="monospace"><rect width="${S}" height="${S}" fill="#191919"/>`];
 let a=-Math.PI/2;
 DATA.children.forEach((c,i)=>{
  const w=TAU*c.value/DATA.value, id=idmap.push(c)-1;
  out.push(`<path d="${sec(HOLE,HOLE+inner,a,a+w)}" fill="${col(i,n,1,0)}" stroke="#fff" data-id="${id}" data-kind="lang" data-path="/${esc(c.name)}" data-info="${c.value} projects"><title>/${esc(c.name)}
${c.value} projects</title></path>`);
  if(sel===c&&c.children){
   const o0=HOLE+inner+3,o1=HOLE+B;let b=a;
   c.children.forEach((p,j)=>{
    const pw=w*p.value/c.value, pid=idmap.push(p)-1;
    out.push(`<path d="${sec(o0,o1,b,b+pw)}" fill="${col(i,n,2,j)}" stroke="#fff" data-id="${pid}" data-kind="repo" data-path="/${esc(c.name)}/${esc(p.name)}" data-info="1 project"><title>/${esc(c.name)}/${esc(p.name)}
1 project</title></path>`);
    b+=pw;});}
  a+=w;});
 const num=sel?sel.value:DATA._projects;
 const lab=sel?sel.name.toUpperCase().slice(0,12):"PROJECTS";
 out.push(`<circle id="core" cx="${C}" cy="${C}" r="${HOLE-6}" fill="#202020" style="cursor:pointer"/>`);
 out.push(`<text x="${C}" y="${C-8}" fill="#eee" font-size="30" font-weight="bold" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">${num}</text>`);
 out.push(`<text x="${C}" y="${C+18}" fill="#aaa" font-size="11" letter-spacing="2" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">${lab}</text></svg>`);
 document.getElementById("chart").innerHTML=out.join("")}
document.getElementById("chart").addEventListener("click",e=>{
 if(e.target.id=="core"){sel=null;render();return}
 const nd=idmap[e.target.dataset.id];
 if(!nd||e.target.dataset.kind!="lang")return;
 sel=(sel===nd)?null:nd;render()});
const tip=document.getElementById("tip");
document.getElementById("chart").addEventListener("mousemove",e=>{
 const t=e.target.closest("path[data-path]");
 if(!t){tip.style.display="none";return}
 tip.innerHTML=t.dataset.path+"<br>"+t.dataset.info;
 tip.style.display="block";tip.style.left=e.clientX+14+"px";tip.style.top=e.clientY+10+"px"});
render();
</script></body></html>
