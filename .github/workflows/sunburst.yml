name: sunburst
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 sunburst.py --user ${{ github.repository_owner }} --repo ${{ github.repository }} --include-private --token ${{ secrets.SUNBURST_TOKEN }} --out-dir assets --readme README.md
      - run: |
          git config user.name "sunburst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: refresh sunburst" && git push)
